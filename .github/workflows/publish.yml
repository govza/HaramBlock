name: Publish Extension

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - chrome
          - firefox
          - edge
      dry_run:
        description: "Dry run (test without publishing)"
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run compile

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:unit

  publish:
    name: Build & Publish
    needs: test
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Zip extensions
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create v${{ steps.version.outputs.version }} \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            .output/*.zip
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Submit to all stores
        if: inputs.target == 'all'
        run: pnpm submit

      - name: Submit to Chrome Web Store
        if: inputs.target == 'chrome'
        run: pnpm submit:chrome

      - name: Submit to Firefox Add-ons
        if: inputs.target == 'firefox'
        run: pnpm submit:firefox

      - name: Submit to Edge Add-ons
        if: inputs.target == 'edge'
        run: pnpm submit:edge
