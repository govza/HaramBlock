name: Publish Extension

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - chrome
          - firefox
          - edge
      dry_run:
        description: "Dry run (test without publishing)"
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run compile

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:unit

  publish:
    name: Build & Publish
    needs: test
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Chrome extension
        if: inputs.target == 'all' || inputs.target == 'chrome' || inputs.target == 'edge'
        run: pnpm zip

      - name: Build Firefox extension
        if: inputs.target == 'all' || inputs.target == 'firefox'
        run: pnpm zip:firefox

      - name: List output directory
        run: ls -la .output/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: .output/haram-block-*.zip
          if-no-files-found: error

      - name: Submit to all stores
        if: inputs.target == 'all'
        run: pnpm submit

      - name: Submit to Chrome Web Store
        if: inputs.target == 'chrome'
        run: pnpm submit:chrome

      - name: Submit to Firefox Add-ons
        if: inputs.target == 'firefox'
        run: pnpm submit:firefox

      - name: Submit to Edge Add-ons
        if: inputs.target == 'edge'
        run: pnpm submit:edge
