name: Publish Extension

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Bump version before publishing"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      target:
        description: "Publish target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - chrome
          - firefox
          - edge
      dry_run:
        description: "Dry run (test without publishing)"
        required: false
        default: false
        type: boolean

jobs:
  bump-version:
    name: Bump Version
    if: inputs.version_bump != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: npm version ${{ inputs.version_bump }} --no-git-tag-version

      - name: Commit and push
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git add package.json
          git commit -m "Bump package version to $VERSION"
          git push

  test:
    name: Run Tests
    needs: bump-version
    if: always() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run compile

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:unit

  publish:
    name: Build & Publish
    needs: [bump-version, test]
    if: always() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped') && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Zip extensions
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          if gh release view v${{ steps.version.outputs.version }} > /dev/null 2>&1; then
            echo "Release v${{ steps.version.outputs.version }} already exists, skipping"
          else
            gh release create v${{ steps.version.outputs.version }} \
              --title "v${{ steps.version.outputs.version }}" \
              --generate-notes \
              .output/*.zip
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Submit to all stores
        if: inputs.target == 'all'
        run: pnpm submit

      - name: Submit to Chrome Web Store
        if: inputs.target == 'chrome'
        run: pnpm submit:chrome

      - name: Submit to Firefox Add-ons
        if: inputs.target == 'firefox'
        run: pnpm submit:firefox

      - name: Submit to Edge Add-ons
        if: inputs.target == 'edge'
        run: pnpm submit:edge
