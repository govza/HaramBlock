name: Lint

on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Prepare WXT
        run: pnpm run postinstall

      - name: TypeScript check
        run: pnpm run compile

      - name: Prettier check
        run: pnpm run format:check

      - name: ESLint check
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm run test:unit
