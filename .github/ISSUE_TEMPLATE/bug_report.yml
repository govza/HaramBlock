name: 🐞 Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the site URL if it's site-specific.
      placeholder: |
        1. Open https://...
        2. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Extension version and browser
      placeholder: 1.2.3, Chrome 130 on Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. Paste the logs from the popup's "Copy logs" button.
      render: text
